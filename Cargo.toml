[package]
name = "univariate"
version = "0.0.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
publish = false
description = "Univariate polynomial arithmetic over GF(2^m): ring ops, gcd/EEA, division, root-finding, evaluation, interpolation, truncated power series."
categories = ["algorithms", "mathematics", "no-std"]
exclude = ["/.github", "/.plans"]

[features]
default = ["std", "simd", "fft"]
std = ["fgf/std"]
# simd implies std, as in fgf and gfm: fgf's backend cache is a LazyLock, and a
# simd-without-std combination would compile and silently run scalar.
simd = ["std", "fgf/simd"]
# Structured-domain evaluation/interpolation composes butterfly-fft (which
# carries its own SIMD `unsafe`). Most L1 consumers want it; a transform-free
# consumer builds --no-default-features to drop it. Works without `std`:
# butterfly-fft's core is no_std-capable, and so is everything this feature
# gates here.
fft = ["dep:butterfly-fft"]
# Optional batch/symbol-axis parallelism. Off by default; must not enter
# default or no-std builds.
parallel = ["std", "dep:rayon"]
# univariate's own unstable surface, for benchmarks and downstream
# experimentation. Not a compatibility promise. Distinct from fgf's
# `internals`, which this crate deliberately does not take.
internals = []

[dependencies]
# Field arithmetic and packed-buffer vector kernels, pinned by rev: a
# floating dependency is a format-break risk when the dependency feeds wire
# bytes. Swap this rev with the other ecosystem consumers in the same sitting.
fgf = { git = "https://github.com/nanithefkuc/fgf", rev = "d0e331cec2e6ae5645e529597fa913db467a44cd" }
# Additive-FFT transforms for subspace/coset domains, composed (never
# re-implemented) under the default-on `fft` feature.
butterfly-fft = { git = "https://github.com/nanithefkuc/butterfly-fft", rev = "6b3f52485bfff2664d6b0c92452137e618a60932", optional = true, default-features = false }
rayon = { version = "1", optional = true }

[dev-dependencies]
# Default features pull in plotters + rayon, which this harness does not use.
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
proptest = { version = "1", default-features = true }

[[bench]]
name = "poly"
harness = false

[profile.bench]
lto = "thin"
codegen-units = 1

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
